name: tests

# Installs the project exactly as the README tells users to, on Windows, macOS and Linux,
# then runs the physics validation tests and an off-screen smoke test of the GUI.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install the simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest -q -p no:warnings

  install-scripts:
    # Checks that the one-click installers in scripts/ work on a clean machine.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      WINDTUNNEL_SKIP_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Run installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\install_windows.bat
      - name: Run installer (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/install_mac_linux.sh
      - name: Check the app imports from the installed environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python -c "import windtunnel.gui.app; print('ok')"
      - name: Check the app imports from the installed environment (macOS / Linux)
        if: runner.os != 'Windows'
        run: .venv/bin/python -c "import windtunnel.gui.app; print('ok')"
      - name: Create a desktop shortcut (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\create_shortcut_windows.bat --no-menu --desktop "%RUNNER_TEMP%" && dir "%RUNNER_TEMP%\Virtual Wind Tunnel.lnk"
      - name: Create a desktop shortcut (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/create_shortcut_mac_linux.sh --no-menu --desktop "$RUNNER_TEMP" && ls -la "$RUNNER_TEMP"
