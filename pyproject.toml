[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windtunnel-sim"
version = "1.0.0"
description = "Virtual wind tunnel: airfoils, 3-D wings, propellers and blunt bodies with streamlines and a draggable flow probe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "oreo7382" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PySide6>=6.5",
]
keywords = ["aerodynamics", "airfoil", "wind tunnel", "panel method", "propeller", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
windtunnel = "windtunnel.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windtunnel = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
